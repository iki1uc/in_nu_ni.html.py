@keyframes blinkCursor {
  0%, 49% {
    opacity: 1;
  }

  50%, 100% {
    opacity: 0;
  }
}

@keyframes pulseRed {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(255,43,43,.45), 0 12px 34px rgba(255,43,43,.22);
  }

  50% {
    box-shadow: 0 0 0 7px rgba(255,43,43,0), 0 12px 34px rgba(255,43,43,.32);
  }
}

@keyframes scan {
  0% {
    transform: translateX(-100%);
  }

  100% {
    transform: translateX(320%);
  }
}

.falling {
  animation: fallStone .62s ease-in forwards;
}

.cursor-blink {
  animation: blinkCursor 1.05s steps(1) infinite;
}

.commando-pulse {
  animation: pulseRed 1.6s ease-in-out infinite;
}

.scanline {
  animation: scan 2.8s linear infinite;
}
