  background: var(--bg);
}

  font: inherit;

  cursor: pointer;

  cursor: not-allowed;
  opacity: .55;

@keyframes fallStone {
  0% {
    transform: translateY(-18px) rotate(-10deg);
    opacity: .25;
  }

  55% {
    transform: translateY(8px) rotate(78deg);
    opacity: 1;
  }

  100% {
    transform: translateY(0) rotate(90deg);
    opacity: 1;
  }
}

@keyframes blinkCursor {
  0%, 49% {
    opacity: 1;
  }

  50%, 100% {
    opacity: 0;
  }
}

@keyframes pulseRed {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(255,43,43,.45), 0 12px 34px rgba(255,43,43,.22);
  }

  50% {
    box-shadow: 0 0 0 7px rgba(255,43,43,0), 0 12px 34px rgba(255,43,43,.32);
  }
}

@keyframes scan {
  0% {
    transform: translateX(-100%);
  }

  100% {
    transform: translateX(320%);
  }
}

@keyframes wobble {
  0%{
    transform:translate(0,0) rotate(0deg)
  }

  20%{
    transform:translate(-1px,2px) rotate(-0.8deg)
  }

  40%{
    transform:translate(2px,-1px) rotate(0.9deg)
  }

  60%{
    transform:translate(-2px,1px) rotate(-0.6deg)
  }

  80%{
    transform:translate(1px,1px) rotate(0.7deg)
  }

  100%{
    transform:translate(0,0) rotate(0deg)
  }
}

.falling {
  animation: fallStone .62s ease-in forwards;
}

.cursor-blink {
  animation: blinkCursor 1.05s steps(1) infinite;
}

.commando-pulse {
  animation: pulseRed 1.6s ease-in-out infinite;

.scanline {
